name: Update Void shlibs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-shlibs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    steps:
      - name: Prepare container
        run: |
          printf '\033[1;34m==> Stage: Prepare container (Void)\033[0m\n'
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -y sudo bash curl git libstdc++
          useradd -G xbuilder -M builder

      - name: Checkout UURepository/Packages
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone void-packages
        run: |
          printf '\033[1;34m==> Stage: Clone void-packages\033[0m\n'
          git clone --depth=1 https://github.com/void-linux/void-packages.git /void-packages
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> /void-packages/etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> /void-packages/etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> /void-packages/etc/conf

      - name: Copy packages into void-packages
        run: |
          printf '\033[1;34m==> Stage: Copy packages into void-packages\033[0m\n'
          VOID_DIR=$(pwd)/void
          for pkg_path in "$VOID_DIR"/*/; do
            pkg=$(basename "$pkg_path")
            case "$pkg" in _*) continue ;; esac
            [ -f "$pkg_path/template" ] || continue
            echo "=> Syncing $pkg"
            rm -rf "/void-packages/srcpkgs/$pkg"
            cp -r "$pkg_path" "/void-packages/srcpkgs/$pkg"
          done
          chown -R builder:builder /void-packages

      - name: Merge custom shlibs into void-packages
        run: |
          printf '\033[1;34m==> Stage: Merge custom shlibs\033[0m\n'
          VOID_DIR=$(pwd)/void
          sudo -Eu builder bash -c '
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              lib=$(echo "$line" | awk "{print \$1}")
              base=$(echo "$lib" | sed "s/\.so\.[0-9][0-9.]*$//")
              sed -i "/^${base}\.so\./d" /void-packages/common/shlibs
              echo "$line" >> /void-packages/common/shlibs
            done < '"$VOID_DIR"'/../common/shlibs
          '

      - name: Bootstrap void-packages
        run: |
          printf '\033[1;34m==> Stage: Bootstrap void-packages\033[0m\n'
          sudo -Eu builder sh -c "cd /void-packages && ./xbps-src binary-bootstrap"

          sudo -Eu builder mkdir -p /void-packages/masterdir-x86_64/var/db/xbps/keys
          sudo -Eu builder tee /void-packages/masterdir-x86_64/var/db/xbps/keys/d3:aa:73:7a:f7:f4:d4:74:05:e5:ca:c8:63:84:73:a7.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>public-key</key>
                  <data></data>
                  <key>public-key-size</key>
                  <integer>4096</integer>
                  <key>signature-by</key>
                  <string>Universal Repository CI &lt;ci@universalrepo.local&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Build packages and collect shlibs
        run: |
          printf '\033[1;34m==> Stage: Build packages and collect shlibs\033[0m\n'
          VOID_DIR=$(pwd)/void

          for pkgdir in "$VOID_DIR"/*/; do
            [ -d "$pkgdir" ] || continue
            pkgname=$(basename "$pkgdir")
            case "$pkgname" in _*) echo "Skipping $pkgname"; continue ;; esac
            [ -f "$pkgdir/template" ] || continue

            echo "=============================="
            echo "=> Processing $pkgname"
            echo "=============================="

            # Build
            if ! sudo -Eu builder sh -c "cd /void-packages && ./xbps-src -E pkg $pkgname"; then
              echo "WARNING: failed to build $pkgname, skipping shlibs"
              continue
            fi

            # Install into destdir
            if ! sudo -Eu builder sh -c "cd /void-packages && ./xbps-src install $pkgname"; then
              echo "WARNING: failed to install $pkgname into destdir, skipping shlibs"
              continue
            fi

            # Get provided shlibs
            PROVIDES=$(sudo -Eu builder sh -c "cd /void-packages && ./xbps-src show-shlib-provides $pkgname" 2>/dev/null || true)

            if [ -z "$PROVIDES" ]; then
              echo "=> No shlibs provided by $pkgname"
              sudo -Eu builder sh -c "cd /void-packages && ./xbps-src clean $pkgname" || true
              continue
            fi

            echo "=> Shlibs provided by $pkgname:"
            echo "$PROVIDES"

            # Update common/shlibs in the repo checkout
            while IFS= read -r line; do
              SONAME=$(echo "$line" | awk '{print $1}')
              PKGVER=$(echo "$line" | awk '{print $2}')
              [ -z "$SONAME" ] || [ -z "$PKGVER" ] && continue

              if grep -q "^${SONAME} " common/shlibs; then
                OLD=$(grep "^${SONAME} " common/shlibs)
                sed -i "s|^${SONAME} .*|${SONAME} ${PKGVER}|" common/shlibs
                NEW=$(grep "^${SONAME} " common/shlibs)
                [ "$OLD" != "$NEW" ] && echo "  updated: $OLD -> $NEW" || echo "  unchanged: $NEW"
              else
                echo "${SONAME} ${PKGVER}" >> common/shlibs
                echo "  added: ${SONAME} ${PKGVER}"
              fi
            done <<< "$PROVIDES"

            # Clean destdir for next package
            sudo -Eu builder sh -c "cd /void-packages && ./xbps-src clean $pkgname" || true
          done

      - name: Commit and push updated shlibs
        run: |
          printf '\033[1;34m==> Stage: Commit and push shlibs\033[0m\n'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet common/shlibs; then
            echo "=> No shlibs changes to commit"
          else
            echo "=> Changes detected:"
            git diff common/shlibs
            git add common/shlibs
            git commit -m "shlibs: auto-update via workflow"
            git push
          fi
