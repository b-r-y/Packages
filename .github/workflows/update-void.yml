name: Update Void Templates

on:
#  schedule:
#    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-void:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    outputs:
      has_updates: ${{ steps.autoupdate.outputs.has_updates }}
      updated_packages: ${{ steps.autoupdate.outputs.updated_packages }}
    steps:
      - name: Prepare container
        run: |
          printf '\033[1;34m==> Stage: Prepare container\033[0m\n'
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash curl git libstdc++ xtools
          useradd -G xbuilder -M builder
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link workspace to /work/packages
        run: |
          mkdir -p /work
          ln -s "$GITHUB_WORKSPACE" /work/packages
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup void-packages
        run: |
          printf '\033[1;34m==> Stage: Setup void-packages\033[0m\n'
          git clone --depth=1 https://github.com/void-linux/void-packages.git /work/void-packages
          for pkg in ghostty-terminfo ghostty zig; do
            rm -rf /work/void-packages/srcpkgs/$pkg
          done
          cp -r /work/packages/void/* /work/void-packages/srcpkgs/
          chown -R builder:builder /work/void-packages
      - name: Prepare masterdir
        run: |
          printf '\033[1;34m==> Stage: Prepare masterdir\033[0m\n'
          cd /work/void-packages
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          sudo -Eu builder ./xbps-src binary-bootstrap
      - name: Check and apply updates
        id: autoupdate
        run: |
          printf '\033[1;34m==> Stage: Check and apply updates\033[0m\n'
          UPDATED=""
          for pkgdir in /work/packages/void/*; do
            [ -d "$pkgdir" ] || continue
            pkg=$(basename "$pkgdir")
            case "$pkg" in
              _*) echo "=> Skipping $pkg (starts with underscore)"; continue ;;
            esac
            [ -f "$pkgdir/template" ] || continue
            echo "=> Checking $pkg..."
            UPDATE=$(sudo -Eu builder sh -c "cd /work/void-packages && ./xbps-src update-check $pkg 2>/dev/null" | tail -1 || true)
            echo "$UPDATE" | grep -q ' -> ' || continue
            OLD_VER=$(echo "$UPDATE" | awk -F' -> ' '{print $1}' | rev | cut -d- -f1 | rev)
            NEW_VER=$(echo "$UPDATE" | awk -F' -> ' '{print $2}' | rev | cut -d- -f1 | rev | tr -d '\n\r')
            [ -n "$NEW_VER" ] || continue
            [ "$OLD_VER" = "$NEW_VER" ] && continue
            echo "=> $pkg: $OLD_VER -> $NEW_VER"
            sed -i "s|^version=.*|version=${NEW_VER}|" "/work/packages/void/$pkg/template"
            sed -i "s|^revision=.*|revision=1|" "/work/packages/void/$pkg/template"
            cp "/work/packages/void/$pkg/template" "/work/void-packages/srcpkgs/$pkg/template"
            chown builder:builder "/work/void-packages/srcpkgs/$pkg/template"
            if sudo -Eu builder sh -c "cd /work/void-packages && xgensum -i srcpkgs/$pkg/template"; then
              cp "/work/void-packages/srcpkgs/$pkg/template" "/work/packages/void/$pkg/template"
              echo "=> $pkg checksum updated"
              UPDATED="$UPDATED $pkg"
            else
              echo "=> WARNING: checksum failed for $pkg, rolling back"
              git -C "$GITHUB_WORKSPACE" checkout -- "void/$pkg/template"
            fi
          done
          UPDATED=$(echo "$UPDATED" | xargs)
          if [ -n "$UPDATED" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "updated_packages=$UPDATED" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "updated_packages=" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to staging branch
        if: steps.autoupdate.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-update-void-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add void/
          git commit -m "void: auto-update ${{ steps.autoupdate.outputs.updated_packages }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

  update-void-musl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/void-linux/void-musl-full:latest
      options: --privileged
      volumes:
        - /dev:/dev
    outputs:
      has_updates: ${{ steps.autoupdate.outputs.has_updates }}
      updated_packages: ${{ steps.autoupdate.outputs.updated_packages }}
    steps:
      - name: Prepare container
        run: |
          printf '\033[1;34m==> Stage: Prepare container (musl)\033[0m\n'
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash curl git libstdc++ xtools
          useradd -G xbuilder -M builder
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth=1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" fetch --depth=1 origin "${GITHUB_SHA}"
          git -C "${GITHUB_WORKSPACE}" checkout "${GITHUB_SHA}"

      - name: Link workspace to /work/packages
        run: |
          mkdir -p /work
          ln -s "$GITHUB_WORKSPACE" /work/packages
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup void-packages
        run: |
          printf '\033[1;34m==> Stage: Setup void-packages (musl)\033[0m\n'
          git clone --depth=1 https://github.com/void-linux/void-packages.git /work/void-packages
          for pkg_path in /work/packages/void-musl/*/; do
            pkg=$(basename "$pkg_path")
            rm -rf /work/void-packages/srcpkgs/$pkg
          done
          cp -r /work/packages/void-musl/* /work/void-packages/srcpkgs/
          chown -R builder:builder /work/void-packages
      - name: Prepare masterdir
        run: |
          printf '\033[1;34m==> Stage: Prepare masterdir (musl)\033[0m\n'
          cd /work/void-packages
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          sudo -Eu builder ./xbps-src -A x86_64-musl binary-bootstrap
      - name: Check and apply updates
        id: autoupdate
        run: |
          printf '\033[1;34m==> Stage: Check and apply updates (musl)\033[0m\n'
          UPDATED=""
          for pkgdir in /work/packages/void-musl/*; do
            [ -d "$pkgdir" ] || continue
            pkg=$(basename "$pkgdir")
            case "$pkg" in
              _*) echo "=> Skipping $pkg (starts with underscore)"; continue ;;
            esac
            [ -f "$pkgdir/template" ] || continue
            echo "=> Checking $pkg..."
            UPDATE=$(sudo -Eu builder sh -c "cd /work/void-packages && ./xbps-src -A x86_64-musl update-check $pkg 2>/dev/null" | tail -1 || true)
            echo "$UPDATE" | grep -q ' -> ' || continue
            OLD_VER=$(echo "$UPDATE" | awk -F' -> ' '{print $1}' | rev | cut -d- -f1 | rev)
            NEW_VER=$(echo "$UPDATE" | awk -F' -> ' '{print $2}' | rev | cut -d- -f1 | rev | tr -d '\n\r')
            [ -n "$NEW_VER" ] || continue
            [ "$OLD_VER" = "$NEW_VER" ] && continue
            echo "=> $pkg: $OLD_VER -> $NEW_VER"
            sed -i "s|^version=.*|version=${NEW_VER}|" "/work/packages/void-musl/$pkg/template"
            sed -i "s|^revision=.*|revision=1|" "/work/packages/void-musl/$pkg/template"
            cp "/work/packages/void-musl/$pkg/template" "/work/void-packages/srcpkgs/$pkg/template"
            chown builder:builder "/work/void-packages/srcpkgs/$pkg/template"
            if sudo -Eu builder sh -c "cd /work/void-packages && xgensum -i srcpkgs/$pkg/template"; then
              cp "/work/void-packages/srcpkgs/$pkg/template" "/work/packages/void-musl/$pkg/template"
              echo "=> $pkg checksum updated"
              UPDATED="$UPDATED $pkg"
            else
              echo "=> WARNING: checksum failed for $pkg, rolling back"
              git -C "$GITHUB_WORKSPACE" checkout -- "void-musl/$pkg/template"
            fi
          done
          UPDATED=$(echo "$UPDATED" | xargs)
          if [ -n "$UPDATED" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "updated_packages=$UPDATED" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "updated_packages=" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to staging branch
        if: steps.autoupdate.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-update-void-musl-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add void-musl/
          git commit -m "void-musl: auto-update ${{ steps.autoupdate.outputs.updated_packages }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

  commit:
    needs: [update-void, update-void-musl]
    if: needs.update-void.outputs.has_updates == 'true' || needs.update-void-musl.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge staging branches and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "${{ needs.update-void.outputs.has_updates }}" = "true" ]; then
            BRANCH="auto-update-void-${{ github.run_id }}"
            git fetch "$REMOTE" "$BRANCH"
            git merge --no-edit FETCH_HEAD
          fi

          if [ "${{ needs.update-void-musl.outputs.has_updates }}" = "true" ]; then
            BRANCH="auto-update-void-musl-${{ github.run_id }}"
            git fetch "$REMOTE" "$BRANCH"
            git merge --no-edit FETCH_HEAD
          fi

          git push "$REMOTE" HEAD:"${GITHUB_REF_NAME}"

      - name: Delete staging branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${{ needs.update-void.outputs.has_updates }}" = "true" ]; then
            git push "$REMOTE" --delete "auto-update-void-${{ github.run_id }}" || true
          fi
          if [ "${{ needs.update-void-musl.outputs.has_updates }}" = "true" ]; then
            git push "$REMOTE" --delete "auto-update-void-musl-${{ github.run_id }}" || true
          fi
