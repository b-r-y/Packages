name: Auto Label Distros from Issue Form

on:
  issues:
    types: [opened, edited]

jobs:
  label-distro:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check for Arch Linux
        if: contains(github.event.issue.body, '- [x] Arch Linux')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['arch']
            })

      - name: Check for Void Linux
        if: contains(github.event.issue.body, '- [x] Void Linux')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['void']
            })

      - name: Check for Fedora
        if: contains(github.event.issue.body, '- [x] Fedora')
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['fedora']
            })
