# .woodpecker.yml

variables:
  - &env
    environment:
      GPG_PRIVATE_KEY:
        from_secret: GPG_PRIVATE_KEY
      GPG_PASSPHRASE:
        from_secret: GPG_PASSPHRASE
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
      XBPS_PRIVATE_KEY:
        from_secret: XBPS_PRIVATE_KEY

when:
  - event: push
    path:
      include:
        - arch/**
        - fedora/**
        - void/**
  - event: manual

steps:

  # ─────────────────────────────────────────────
  # ARCH
  # ─────────────────────────────────────────────
  clone-arch:
    image: archlinux:base-devel
    <<: *env
    commands:
      - |
        printf '\033[1;34m==> Stage: Clone Packages and Repo (Arch)\033[0m\n'
        pacman -Syu --noconfirm git
        git clone https://codeberg.org/UniversalRepository/Packages.git packages
        git clone https://codeberg.org/UniversalRepository/repo.git repo

  build-arch:
    image: archlinux:base-devel
    <<: *env
    depends_on: [clone-arch]
    commands:
      - |
        printf '\033[1;34m==> Stage: Build Arch packages\033[0m\n'
        pacman -Syu --noconfirm gnupg sudo
        cd packages/arch
        useradd -m builder && echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

        for pkgdir in */; do
          pkgname=$(basename "$pkgdir")
          [[ "$pkgname" == _* ]] && continue
          [ -f "$pkgdir/PKGBUILD" ] || continue

          if [ -n "$CI_PIPELINE_VARS_SKIP_PACKAGES" ]; then
            echo ",$CI_PIPELINE_VARS_SKIP_PACKAGES," | grep -q ",$pkgname," && {
              echo "Skipping $pkgname (skip list)"
              continue
            }
          fi

          source "$pkgdir/PKGBUILD"
          pkgver_full="${pkgname}-${pkgver}-${pkgrel}"

          if ls repo/arch/${pkgname}-*-*.pkg.tar.zst 1>/dev/null 2>&1; then
            echo "Package $pkgver_full already in repo, skipping"
            continue
          fi

          echo "Building Arch package: $pkgver_full"
          cd "$pkgdir"
          chown -R builder:builder .

          su builder -c "mkdir -p ~/.gnupg && echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf"
          su builder -c "echo 'pinentry-mode loopback' > ~/.gnupg/gpg.conf"

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | su builder -c "gpg --batch --import"
          fi

          su builder -c "makepkg -sf --noconfirm"

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            for pkg in *.pkg.tar.zst; do
              [[ "$pkg" == *"-debug-"* ]] && continue
              [ -f "$pkg" ] || continue
              echo "Signing $pkg..."
              echo "$GPG_PASSPHRASE" | su builder -c "gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign $pkg"
            done
          fi

          cd ..
          echo "Built in $pkgdir:"
          ls -lh "$pkgdir"/*.pkg.tar.zst 2>/dev/null || echo "No packages found"
        done

  sync-arch:
    image: archlinux:base-devel
    <<: *env
    depends_on: [build-arch]
    commands:
      - |
        printf '\033[1;34m==> Stage: Sync Arch packages to repo\033[0m\n'
        set -euo pipefail
        shopt -s nullglob globstar
        pacman -Syu --noconfirm git
        mkdir -p repo/arch

        parse_arch_pkg() {
          local file="$1" base arch rel ver name tmp
          base="${file%.pkg.tar.zst}"
          arch="${base##*-}"
          tmp="${base%-*}"; rel="${tmp##*-}"
          tmp="${tmp%-*}"; ver="${tmp##*-}"
          name="${tmp%-*}"
          printf '%s|%s-%s|%s\n' "$name" "$ver" "$rel" "$arch"
        }

        for pkg in packages/arch/**/*.pkg.tar.zst; do
          pkgfile=$(basename "$pkg")
          IFS='|' read -r name verrel _ <<< "$(parse_arch_pkg "$pkgfile")"
          skip_copy=false

          for existing in repo/arch/*.pkg.tar.zst; do
            existing_file=$(basename "$existing")
            IFS='|' read -r existing_name existing_verrel _ <<< "$(parse_arch_pkg "$existing_file")"
            [ "$existing_name" = "$name" ] || continue
            if [ "$existing_verrel" = "$verrel" ]; then
              echo "Arch: $pkgfile already present ($verrel), skipping"
              skip_copy=true
            else
              echo "Arch: replacing $existing_file with $pkgfile"
              rm -f "$existing" "$existing.sig"
            fi
          done

          if [ "$skip_copy" = false ]; then
            cp "$pkg" repo/arch/
            [ -f "$pkg.sig" ] && cp "$pkg.sig" repo/arch/ || true
          fi
        done

        if ls repo/arch/*.pkg.tar.zst 1>/dev/null 2>&1; then
          cd repo/arch
          rm -f universal-repo.db universal-repo.files
          repo-add universal-repo.db.tar.gz *.pkg.tar.zst
          ln -sf universal-repo.db.tar.gz universal-repo.db
          ln -sf universal-repo.files.tar.gz universal-repo.files
        fi

        cd repo
        git config user.name "Woodpecker CI"
        git config user.email "ci@woodpecker"
        git add arch/
        git diff --staged --quiet && { echo "No Arch changes to commit"; exit 0; }
        git commit -m "Update Arch packages [CI] - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        PUSH_URL="https://oauth2:${CODEBERG_TOKEN}@codeberg.org/UniversalRepository/repo.git"
        for attempt in 1 2 3; do
          git pull --rebase origin "$BRANCH" || true
          git push "$PUSH_URL" "$BRANCH" && { echo "Arch push succeeded"; exit 0; }
          echo "Attempt $attempt failed, retrying..."
          sleep 5
        done
        echo "Arch push failed after retries"; exit 1

  # ─────────────────────────────────────────────
  # FEDORA
  # ─────────────────────────────────────────────
  clone-fedora:
    image: fedora:latest
    <<: *env
    commands:
      - |
        printf '\033[1;34m==> Stage: Clone Packages and Repo (Fedora)\033[0m\n'
        dnf install -y git
        git clone https://codeberg.org/UniversalRepository/Packages.git packages
        git clone https://codeberg.org/UniversalRepository/repo.git repo

  build-fedora:
    image: fedora:latest
    <<: *env
    depends_on: [clone-fedora]
    commands:
      - |
        printf '\033[1;34m==> Stage: Build Fedora packages\033[0m\n'
        dnf install -y rpm-build rpmdevtools dnf-plugins-core rpm-sign gnupg2 pinentry sudo spectool createrepo_c
        rpmdev-setuptree
        FEDORA_DIR=packages/fedora
        cd "$FEDORA_DIR"

        for spec in $(ls "$FEDORA_DIR"/*.spec 2>/dev/null | xargs -n1 basename); do
          case "$spec" in _*) echo "Skipping $spec"; continue ;; esac
          spec_path="$FEDORA_DIR/$spec"
          [ -f "$spec_path" ] || continue

          specname=$(basename "$spec" .spec)
          pkgver=$(grep "^Version:" "$spec_path" | awk '{print $2}')
          pkgrel=$(grep "^Release:" "$spec_path" | awk '{print $2}' | cut -d'%' -f1)
          pkgver_full="${specname}-${pkgver}-${pkgrel}"

          if [ -n "$CI_PIPELINE_VARS_SKIP_PACKAGES" ]; then
            echo ",$CI_PIPELINE_VARS_SKIP_PACKAGES," | grep -q ",$specname," && {
              echo "Skipping $specname (skip list)"
              continue
            }
          fi

          if ls repo/fedora/${specname}-${pkgver}-${pkgrel}.fc*.x86_64.rpm 1>/dev/null 2>&1; then
            echo "Package $pkgver_full already in repo, skipping"
            continue
          fi

          echo "Building Fedora package: $pkgver_full"
          rm -rf ~/rpmbuild/BUILD/* ~/rpmbuild/BUILDROOT/*

          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2 | head -1)
            echo "%_signature gpg" >> ~/.rpmmacros
            echo "%_gpg_name $GPG_KEY_ID" >> ~/.rpmmacros
          fi

          cp "$spec_path" ~/rpmbuild/SPECS/
          [ -d sources ] && cp sources/* ~/rpmbuild/SOURCES/ || true

          cd ~/rpmbuild/SPECS
          spectool -g -R "$spec" || true
          dnf builddep -y "$spec"
          rpmbuild -ba "$spec"

          cd "$FEDORA_DIR"
          cp ~/rpmbuild/RPMS/*/*.rpm packages/fedora/ 2>/dev/null || true
          cp ~/rpmbuild/SRPMS/*.rpm packages/fedora/ 2>/dev/null || true
          echo "Built packages:"
          ls -lh packages/fedora/*.rpm 2>/dev/null || echo "No packages found"
        done

  sync-fedora:
    image: fedora:latest
    <<: *env
    depends_on: [build-fedora]
    commands:
      - |
        printf '\033[1;34m==> Stage: Sync Fedora packages to repo\033[0m\n'
        set -euo pipefail
        shopt -s nullglob
        dnf install -y git createrepo_c
        mkdir -p repo/fedora

        parse_fedora_pkg() {
          local file="$1" base arch rel ver name tmp
          base="${file%.rpm}"
          arch="${base##*.}"
          tmp="${base%.*}"; rel="${tmp##*-}"
          tmp="${tmp%-*}"; ver="${tmp##*-}"
          name="${tmp%-*}"
          printf '%s|%s-%s|%s\n' "$name" "$ver" "$rel" "$arch"
        }

        for pkg in packages/fedora/*.rpm; do
          pkgfile=$(basename "$pkg")
          IFS='|' read -r name verrel _ <<< "$(parse_fedora_pkg "$pkgfile")"
          skip_copy=false

          for existing in repo/fedora/*.rpm; do
            existing_file=$(basename "$existing")
            IFS='|' read -r existing_name existing_verrel _ <<< "$(parse_fedora_pkg "$existing_file")"
            [ "$existing_name" = "$name" ] || continue
            if [ "$existing_verrel" = "$verrel" ]; then
              echo "Fedora: $pkgfile already present ($verrel), skipping"
              skip_copy=true
            else
              echo "Fedora: replacing $existing_file"
              rm -f "$existing"
            fi
          done

          [ "$skip_copy" = false ] && cp "$pkg" repo/fedora/ || true
        done

        ls repo/fedora/*.rpm 1>/dev/null 2>&1 && { cd repo/fedora; createrepo_c .; }

        cd repo
        git config user.name "Woodpecker CI"
        git config user.email "ci@woodpecker"
        git add fedora/
        git diff --staged --quiet && { echo "No Fedora changes to commit"; exit 0; }
        git commit -m "Update Fedora packages [CI] - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        PUSH_URL="https://oauth2:${CODEBERG_TOKEN}@codeberg.org/UniversalRepository/repo.git"
        for attempt in 1 2 3; do
          git pull --rebase origin "$BRANCH" || true
          git push "$PUSH_URL" "$BRANCH" && { echo "Fedora push succeeded"; exit 0; }
          echo "Attempt $attempt failed, retrying..."
          sleep 5
        done
        echo "Fedora push failed after retries"; exit 1

  # ─────────────────────────────────────────────
  # VOID
  # ─────────────────────────────────────────────
  clone-void:
    image: ghcr.io/void-linux/void-glibc-full:latest
    <<: *env
    commands:
      - |
        printf '\033[1;34m==> Stage: Clone Packages and Repo (Void)\033[0m\n'
        mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
        sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
        xbps-install -Syu xbps
        xbps-install -y sudo bash curl git libstdc++
        useradd -G xbuilder -M builder 2>/dev/null || true
        git clone https://codeberg.org/UniversalRepository/Packages.git packages
        git clone https://codeberg.org/UniversalRepository/repo.git repo

  build-void:
    image: ghcr.io/void-linux/void-glibc-full:latest
    <<: *env
    depends_on: [clone-void]
    commands:
      - |
        printf '\033[1;34m==> Stage: Build Void packages\033[0m\n'
        mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
        sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
        xbps-install -Syu xbps
        xbps-install -y sudo bash curl git libstdc++ proot
        useradd -G xbuilder -M builder 2>/dev/null || true

        VOID_DIR=packages/void

        git clone --depth=1 https://github.com/void-linux/void-packages.git /void-packages

        for pkg in ghostty-terminfo ghostty zig llvm22; do
          rm -rf /void-packages/srcpkgs/$pkg
        done

        cd /void-packages
        echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
        echo XBPS_CHROOT_CMD=proot >> etc/conf
        echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf

        cp -r "$VOID_DIR"/* srcpkgs/
        chown -R builder:builder /void-packages

        sudo -Eu builder ./xbps-src binary-bootstrap

        mkdir -p /void-packages/etc/xbps.d/custom/
        tee /void-packages/etc/xbps.d/custom/urepo.conf << 'EOF'
        repository=https://universalrepo.r1xelelo.workers.dev/void
        EOF

        mkdir -p masterdir-x86_64/var/db/xbps/keys
        tee masterdir-x86_64/var/db/xbps/keys/71:17:77:eb:82:c2:02:b6:8d:98:05:8d:19:9c:d5:1e.plist << 'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
                <key>public-key</key>
                <data></data>
                <key>public-key-size</key>
                <integer>4096</integer>
                <key>signature-by</key>
                <string>Universal Repository CI &lt;ci@universalrepo.local&gt;</string>
        </dict>
        </plist>
        PLIST

        xbps-install -S || true
        sudo -Eu builder xbps-install -r /void-packages/masterdir-x86_64 jq curl -y

        sudo -Eu builder bash -c '
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            lib=$(echo "$line" | awk "{print \$1}")
            base=$(echo "$lib" | sed "s/\.so\.[0-9]*$//")
            sed -i "/^${base}\.so\./d" /void-packages/common/shlibs
            echo "$line" >> /void-packages/common/shlibs
          done < packages/common/shlibs
        '

        for pkgdir in "$VOID_DIR"/*; do
          [ -d "$pkgdir" ] || continue
          pkgname=$(basename "$pkgdir")
          case "$pkgname" in _*) echo "Skipping $pkgname"; continue ;; esac
          [ -f "$pkgdir/template" ] || continue

          if [ -n "$CI_PIPELINE_VARS_SKIP_PACKAGES" ]; then
            echo ",$CI_PIPELINE_VARS_SKIP_PACKAGES," | grep -q ",$pkgname," && {
              echo "Skipping $pkgname (skip list)"
              continue
            }
          fi

          version=$(grep '^version=' "$pkgdir/template" | head -1 | cut -d'=' -f2)
          revision=$(grep '^revision=' "$pkgdir/template" | head -1 | cut -d'=' -f2)
          pkgver_full="${pkgname}-${version}_${revision}"

          if ls repo/void/${pkgname}-${version}_${revision}*.xbps 1>/dev/null 2>&1; then
            echo "Package $pkgver_full already in repo, skipping"
            continue
          fi

          echo "Building Void package: $pkgver_full"
          mkdir -p /void-packages/srcpkgs/$pkgname
          cp "$pkgdir/template" /void-packages/srcpkgs/$pkgname/
          chown -R builder:builder /void-packages/srcpkgs/$pkgname

          sudo -Eu builder sh -c "cd /void-packages && ./xbps-src -E pkg $pkgname"

          find /void-packages/hostdir/binpkgs -name "${pkgname}-*.xbps" -exec cp {} packages/void/ \;
          find /void-packages/hostdir/binpkgs -name "${pkgname}-*.xbps.sig*" -exec cp {} packages/void/ \; 2>/dev/null || true

          echo "Built packages:"
          ls -lh packages/void/*.xbps 2>/dev/null || echo "No packages found"
        done

  sync-void:
    image: ghcr.io/void-linux/void-glibc-full:latest
    <<: *env
    depends_on: [build-void]
    commands:
      - |
        printf '\033[1;34m==> Stage: Sync Void packages to repo\033[0m\n'
        set -euo pipefail
        shopt -s nullglob
        mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
        sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
        xbps-install -Syu xbps
        xbps-install -y git
        mkdir -p repo/void

        parse_void_pkg() {
          local file="$1" base arch verrev name tmp
          base="${file%.xbps}"
          arch="${base##*.}"
          tmp="${base%.*}"
          verrev="${tmp##*-}"
          name="${tmp%-*}"
          printf '%s|%s|%s\n' "$name" "$verrev" "$arch"
        }

        for pkg in packages/void/*.xbps; do
          pkgfile=$(basename "$pkg")
          IFS='|' read -r name verrev _ <<< "$(parse_void_pkg "$pkgfile")"
          skip_copy=false

          for existing in repo/void/*.xbps; do
            existing_file=$(basename "$existing")
            IFS='|' read -r existing_name existing_verrev _ <<< "$(parse_void_pkg "$existing_file")"
            [ "$existing_name" = "$name" ] || continue
            if [ "$existing_verrev" = "$verrev" ]; then
              echo "Void: $pkgfile already present ($verrev), skipping"
              skip_copy=true
            else
              echo "Void: replacing $existing_file"
              rm -f "$existing" "$existing.sig" "$existing.sig2"
            fi
          done

          if [ "$skip_copy" = false ]; then
            cp "$pkg" repo/void/
            [ -f "$pkg.sig"  ] && cp "$pkg.sig"  repo/void/ || true
            [ -f "$pkg.sig2" ] && cp "$pkg.sig2" repo/void/ || true
          fi
        done

        if ls repo/void/*.xbps 1>/dev/null 2>&1; then
          cd repo/void
          XBPS_ARCH=x86_64 xbps-rindex -a *.xbps

          if [ -n "$XBPS_PRIVATE_KEY" ]; then
            echo "Signing Void packages..."
            mkdir -p xbps-sign
            printf '%s\n' "$XBPS_PRIVATE_KEY" > xbps-sign/id_rsa
            chmod 600 xbps-sign/id_rsa
            for p in *.xbps; do
              xbps-rindex --privkey xbps-sign/id_rsa -S "$p" || true
            done
            XBPS_ARCH=x86_64 xbps-rindex \
              --signedby 'Universal Repository CI <ci@universalrepo.local>' \
              --privkey xbps-sign/id_rsa -s . || true
            rm -rf xbps-sign
          else
            echo "XBPS_PRIVATE_KEY not set, skipping signing"
          fi
        fi

        cd repo
        git config user.name "Woodpecker CI"
        git config user.email "ci@woodpecker"
        git add void/
        git diff --staged --quiet && { echo "No Void changes to commit"; exit 0; }
        git commit -m "Update Void packages [CI] - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        PUSH_URL="https://oauth2:${CODEBERG_TOKEN}@codeberg.org/UniversalRepository/repo.git"
        for attempt in 1 2 3; do
          git pull --rebase origin "$BRANCH" || true
          git push "$PUSH_URL" "$BRANCH" && { echo "Void push succeeded"; exit 0; }
          echo "Attempt $attempt failed, retrying..."
          sleep 5
        done
        echo "Void push failed after retries"; exit 1