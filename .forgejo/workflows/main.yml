name: OS Build Dispatcher
on: [push]

jobs:
  trigger-build:
    runs-on: codeberg-small
    steps:
      - name: Trigger GitHub workflow for all packages
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUBTOKEN }}" \
            https://api.github.com/repos/rXelelo/codeberg-builder/dispatches \
            -d '{"event_type":"build-arch","client_payload":{"commit_message":"${{ forgejo.event.head_commit.message }}","commit_sha":"${{ forgejo.sha }}"}}'
